name: General CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  linux:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Setup V
        uses: vlang/setup-v@v1.3
        with:
          stable: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --quiet -y libayatana-appindicator3-dev \
                                          libgtk-3-dev \
                                          libgdk-pixbuf-2.0-dev

      - name: Checkout vtray
        uses: actions/checkout@v4
        with:
          path: m

      - name: Link the local vtray folder in ~/.vmodules/vtray
        run: |
          mkdir -p ~/.vmodules
          rm -rf ~/.vmodules/vtray
          ln -s $(pwd)/m ~/.vmodules/vtray
          v version

      - name: Check code formatting
        run: |
          cd m
          v fmt -verify .

      - name: Build vtray with -shared
        run: |
          cd m
          v -shared .

      - name: Run tests
        run: |
          cd m
          v test .

      - name: Build the examples
        run: |
          cd m
          v should-compile-all examples/

      - name: Check md files
        run: |
          cd m
          v check-md README.md

  windows-cross:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup V
        uses: vlang/setup-v@v1.3
        with:
          stable: true

      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install --quiet -y mingw-w64

      - name: Checkout vtray
        uses: actions/checkout@v4
        with:
          path: m

      - name: Cross-compile for Windows
        run: |
          cd m
          v -os windows -o vtray_test.exe -cc x86_64-w64-mingw32-gcc \
            -cflags '-Wno-error=incompatible-pointer-types' examples/simple_tray.v

      - name: Verify GUI subsystem (no console)
        run: |
          file m/vtray_test.exe | grep -q "(GUI)"
